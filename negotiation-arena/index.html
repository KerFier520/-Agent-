<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negotiation Arena</title><style>:root{
  --background:#ffffff; --foreground:#0f1419;
  --muted-foreground:#64748b; --border:#e2e8f0;
  --primary:#2563eb; --primary-foreground:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --background:#0f1419; --foreground:#e8edf4;
    --muted-foreground:#8b98a9; --border:#232b36;
    --primary:#4d94ff; --primary-foreground:#06121f;
  }
}
body{margin:0;padding:24px;background:var(--background);color:var(--foreground);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:1180px;margin:0 auto;}</style></head><body><div class="wrap"><div id="na-root">
<style>
/* ===== 跟随宿主主题：所有表面由同一组 token 派生，杜绝背景色拼接差 ===== */
#na-root{
  --na-fg:var(--foreground);
  --na-muted:var(--muted-foreground);
  --na-dim:color-mix(in srgb, var(--muted-foreground) 82%, var(--foreground));
  --na-line:var(--border);
  --na-accent:var(--primary);

  /* 统一的表面层级：全部以宿主 background 为基底叠加同色半透明，深浅主题自适应 */
  --na-l0:var(--background);
  --na-l1:color-mix(in srgb, var(--foreground) 3.5%, var(--background));
  --na-l2:color-mix(in srgb, var(--foreground) 7%, var(--background));
  --na-l3:color-mix(in srgb, var(--foreground) 11%, var(--background));
  --na-hair:color-mix(in srgb, var(--foreground) 12%, transparent);

  --na-good:#2fa37a; --na-warn:#c88a1b; --na-bad:#d6543f;
  --na-you:var(--primary); --na-buyer:#8b6fc7; --na-cfo:#c88a1b;
  --na-advisor:#2fa37a; --na-judge:#c96f3f;

  background:var(--na-l0); color:var(--na-fg);
  border:1px solid var(--na-line); border-radius:12px; overflow:hidden;
  font-size:14px; line-height:1.6; container-type:inline-size;
  font-variant-numeric:tabular-nums;
}
@media (prefers-color-scheme: dark){
  #na-root{
    --na-good:#4ec99a; --na-warn:#e3b457; --na-bad:#f07a66;
    --na-buyer:#b79aec; --na-cfo:#e3b457; --na-advisor:#4ec99a; --na-judge:#ea9a6b;
  }
}
#na-root *{box-sizing:border-box;}
#na-root button,#na-root textarea,#na-root input{font-family:inherit;}

/* ===== header ===== */
.na-top{padding:18px 20px 15px; background:var(--na-l1); border-bottom:1px solid var(--na-line);}
.na-title{font-size:16px; font-weight:650; letter-spacing:-.01em; margin:0 0 4px;}
.na-sub{font-size:12.5px; color:var(--na-muted); margin:0; max-width:76ch;}
.na-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:11px;}
.na-badge{font-size:11px; padding:2.5px 9px; border-radius:5px; background:var(--na-l2);
  border:1px solid var(--na-line); color:var(--na-muted); font-weight:500;}
.na-badge.on{color:var(--na-accent); border-color:color-mix(in srgb,var(--primary) 38%,transparent);
  background:color-mix(in srgb,var(--primary) 9%,var(--na-l1));}

/* ===== 仪表条 ===== */
.na-strip{display:grid; grid-template-columns:repeat(5,1fr); background:var(--na-l0);
  border-bottom:1px solid var(--na-line);}
.na-cell{padding:11px 14px; border-right:1px solid var(--na-hair);}
.na-cell:last-child{border-right:none;}
.na-cell .k{font-size:10.5px; color:var(--na-muted); letter-spacing:.06em; text-transform:uppercase; font-weight:500;}
.na-cell .v{font-size:19px; font-weight:650; letter-spacing:-.02em; margin-top:2px; line-height:1.25;}
.na-cell .v small{font-size:11px; font-weight:450; color:var(--na-muted); margin-left:2px; letter-spacing:0;}
.na-bar{height:3px; border-radius:99px; background:var(--na-l3); margin-top:7px; overflow:hidden;}
.na-bar i{display:block; height:100%; border-radius:99px; transition:width .4s cubic-bezier(.4,0,.2,1), background .4s;}

/* ===== 阶段 ===== */
.na-phases{display:flex; padding:12px 20px; background:var(--na-l1);
  border-bottom:1px solid var(--na-line); overflow-x:auto; overflow-y:hidden;}
.na-ph{flex:1 1 0; min-width:76px; text-align:center; position:relative; padding:0 4px;}
.na-ph .dot{width:8px;height:8px;border-radius:99px;background:var(--na-l3);margin:0 auto 6px;
  transition:background .3s, box-shadow .3s; position:relative; z-index:1;}
.na-ph.done .dot{background:var(--na-muted);}
.na-ph.cur .dot{background:var(--na-accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,transparent);}
.na-ph .lb{font-size:11px; color:var(--na-muted); white-space:nowrap;}
.na-ph.cur .lb{color:var(--na-fg); font-weight:600;}
.na-ph:not(:last-child):after{content:"";position:absolute;top:3.5px;left:calc(50% + 9px);
  width:calc(100% - 18px);height:1px;background:var(--na-hair);}

/* ===== 主体 ===== */
.na-body{display:grid; grid-template-columns:1.3fr 1fr; background:var(--na-l0);}
.na-body > .na-pane:first-child{border-right:1px solid var(--na-line);}
@container (max-width: 780px){
  .na-body{grid-template-columns:1fr;}
  .na-body > .na-pane:first-child{border-right:none; border-bottom:1px solid var(--na-line);}
  .na-strip{grid-template-columns:repeat(3,1fr);}
  .na-cell:nth-child(3){border-right:none;}
}
.na-pane{min-width:0; background:var(--na-l0);}

/* ===== 对话 ===== */
.na-log{height:452px; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px;
  scroll-behavior:smooth;}
.na-log::-webkit-scrollbar,.na-ctl::-webkit-scrollbar,.na-snaps::-webkit-scrollbar{width:8px;}
.na-log::-webkit-scrollbar-thumb,.na-ctl::-webkit-scrollbar-thumb,.na-snaps::-webkit-scrollbar-thumb{
  background:var(--na-l3); border-radius:99px;}
.na-msg{display:flex; gap:10px; animation:na-in .3s cubic-bezier(.2,.8,.3,1);}
@keyframes na-in{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){ .na-msg{animation:none;} .na-bar i{transition:none;} }
.na-av{width:26px;height:26px;flex:none;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:650;color:#fff;letter-spacing:-.02em;}
.na-msg .bd{min-width:0; flex:1;}
.na-nm{font-size:11.5px; font-weight:600; margin-bottom:3px; display:flex; gap:6px;
  align-items:center; flex-wrap:wrap;}
.na-nm .tag{font-size:10px; font-weight:500; padding:1px 6px; border-radius:4px;
  background:var(--na-l2); color:var(--na-muted); border:1px solid var(--na-hair);}
.na-tx{font-size:13px; color:var(--na-fg); opacity:.88; white-space:pre-wrap; word-break:break-word;}
.na-terms{margin-top:7px; font-size:11.5px; color:var(--na-muted); background:var(--na-l1);
  border:1px solid var(--na-line); border-left:2px solid var(--na-line);
  border-radius:0 6px 6px 0; padding:7px 10px;}
.na-msg.you .na-av{background:var(--na-you);} .na-msg.you .na-nm{color:var(--na-you);}
.na-msg.you .na-terms{border-left-color:var(--na-you);}
.na-msg.buyer .na-av{background:var(--na-buyer);} .na-msg.buyer .na-nm{color:var(--na-buyer);}
.na-msg.buyer .na-terms{border-left-color:var(--na-buyer);}
.na-msg.cfo .na-av{background:var(--na-cfo);} .na-msg.cfo .na-nm{color:var(--na-cfo);}
.na-msg.advisor .na-av{background:var(--na-advisor);} .na-msg.advisor .na-nm{color:var(--na-advisor);}
.na-msg.judge .na-av{background:var(--na-judge);} .na-msg.judge .na-nm{color:var(--na-judge);}
.na-msg.system .na-av{background:var(--na-muted);} .na-msg.system .na-nm{color:var(--na-muted);}
.na-msg.system .na-tx{color:var(--na-muted); font-size:12.5px; opacity:1;}

/* ===== 控制区 ===== */
.na-ctl{padding:16px 18px; display:flex; flex-direction:column; gap:16px;
  max-height:452px; overflow-y:auto;}
.na-sec{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--na-muted);
  font-weight:600; margin-bottom:9px; display:flex; justify-content:space-between;
  align-items:baseline; gap:8px;}
.na-sec .hint{text-transform:none; letter-spacing:0; font-weight:450; font-size:11px;
  text-align:right; flex:1; min-width:0;}
.na-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px 13px;}
.na-f label{display:flex; justify-content:space-between; align-items:baseline; gap:6px;
  font-size:11px; color:var(--na-muted); margin-bottom:5px;}
.na-f label b{color:var(--na-fg); font-weight:600; font-size:12px;}
.na-f input[type=range]{width:100%; accent-color:var(--na-accent); height:18px; margin:0; display:block;}
.na-chk{display:flex; align-items:center; gap:8px; font-size:12.5px; margin-top:12px;
  padding:9px 11px; background:var(--na-l1); border:1px solid var(--na-line); border-radius:8px;
  cursor:pointer;}
.na-chk input{accent-color:var(--na-accent); width:15px; height:15px; margin:0;}

.na-moves{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
.na-mv{text-align:left; background:var(--na-l1); border:1px solid var(--na-line); color:var(--na-fg);
  border-radius:8px; padding:8px 10px; cursor:pointer; font-size:12px;
  transition:border-color .15s, background .15s;}
.na-mv:hover{background:var(--na-l2); border-color:color-mix(in srgb,var(--foreground) 22%,transparent);}
.na-mv[aria-pressed=true]{border-color:var(--na-accent);
  background:color-mix(in srgb,var(--primary) 10%,var(--na-l1));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 30%,transparent);}
.na-mv .t{font-weight:600; display:block; letter-spacing:-.01em;}
.na-mv .h{display:block; font-size:10.5px; color:var(--na-dim); line-height:1.45; margin-top:3px;}
.na-mv:focus-visible,.na-btn:focus-visible,.na-sn:focus-visible{outline:2px solid var(--na-accent); outline-offset:2px;}

.na-ta{width:100%; background:var(--na-l1); border:1px solid var(--na-line); color:var(--na-fg);
  border-radius:8px; padding:9px 11px; font-size:12.5px; resize:vertical; min-height:58px; display:block;}
.na-ta::placeholder{color:var(--na-muted); opacity:.75;}
.na-ta:focus{outline:none; border-color:var(--na-accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent);}

.na-act{display:flex; gap:9px;}
.na-btn{border:none; border-radius:8px; padding:11px 14px; font-size:13px; font-weight:600;
  cursor:pointer; transition:opacity .15s, background .15s; letter-spacing:-.01em;}
.na-btn.primary{flex:1; background:var(--na-accent); color:var(--primary-foreground,#fff);}
.na-btn.primary:hover:not(:disabled){opacity:.88;}
.na-btn.primary:disabled{background:var(--na-l2); color:var(--na-muted); cursor:not-allowed;
  border:1px solid var(--na-line);}
.na-btn.ghost{flex:none; background:var(--na-l1); color:var(--na-fg); border:1px solid var(--na-line);}
.na-btn.ghost:hover{background:var(--na-l2);}

.na-cfo-box{border:1px solid var(--na-line); border-left:2px solid var(--na-cfo);
  border-radius:0 7px 7px 0; padding:9px 11px; font-size:11.5px; background:var(--na-l1);
  color:var(--na-muted); margin-top:10px;}
.na-cfo-box.veto{border-left-color:var(--na-bad);
  background:color-mix(in srgb,var(--na-bad) 7%,var(--na-l1)); color:var(--na-fg);}
.na-cfo-box b{color:var(--na-fg); font-weight:600;}
.na-econ{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.na-econ div{background:var(--na-l1); border:1px solid var(--na-line); border-radius:8px; padding:8px 10px;}
.na-econ .k{font-size:10px; color:var(--na-muted); letter-spacing:.03em;}
.na-econ .v{font-size:14.5px; font-weight:650; margin-top:1px; letter-spacing:-.02em;}

.na-snaps{display:flex; flex-direction:column; gap:5px; max-height:132px; overflow-y:auto;}
.na-sn{display:flex; justify-content:space-between; align-items:center; gap:10px;
  background:var(--na-l1); border:1px solid var(--na-line); border-radius:7px; padding:7px 10px;
  font-size:11.5px; cursor:pointer; color:var(--na-fg); text-align:left; width:100%;
  transition:border-color .15s, background .15s;}
.na-sn:hover:not(:disabled){border-color:var(--na-accent); background:var(--na-l2);}
.na-sn:disabled{cursor:default;}
.na-sn .m{color:var(--na-muted); font-size:10.5px; white-space:nowrap; flex:none;}
.na-sn .l{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ===== 复盘 ===== */
.na-rep{padding:20px; border-top:1px solid var(--na-line); background:var(--na-l1); display:none;}
.na-rep.show{display:block;}
.na-rep h3{margin:0 0 5px; font-size:15px; font-weight:650; letter-spacing:-.01em;}
.na-verdict{font-size:12.5px; color:var(--na-muted); margin-bottom:16px; max-width:80ch;}
.na-scores{display:grid; grid-template-columns:repeat(6,1fr); gap:9px; margin-bottom:18px;}
@container (max-width: 720px){
  .na-scores{grid-template-columns:repeat(3,1fr);}
  .na-rev{grid-template-columns:repeat(2,1fr)!important;}
}
.na-sc{background:var(--na-l0); border:1px solid var(--na-line); border-radius:9px;
  padding:11px 8px; text-align:center;}
.na-sc .k{font-size:10px; color:var(--na-muted); letter-spacing:.03em;}
.na-sc .v{font-size:22px; font-weight:700; line-height:1.15; margin-top:2px; letter-spacing:-.03em;}
.na-sc.total{border-color:var(--na-accent);
  background:color-mix(in srgb,var(--primary) 8%,var(--na-l0));}
.na-rsec{margin-bottom:18px;}
.na-rsec:last-of-type{margin-bottom:0;}
.na-rsec h4{margin:0 0 9px; font-size:10.5px; color:var(--na-muted); text-transform:uppercase;
  letter-spacing:.06em; font-weight:600;}
.na-tp{background:var(--na-l0); border:1px solid var(--na-line); border-left:2px solid var(--na-judge);
  border-radius:0 8px 8px 0; padding:11px 13px; margin-bottom:8px; font-size:12.5px;}
.na-tp .s{font-weight:600; margin-bottom:4px;}
.na-tp .e{color:var(--na-muted); font-size:11.5px;}
.na-tp .cf{color:var(--na-accent); font-size:11.5px; margin-top:5px;}
.na-rev{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; font-size:11.5px;}
.na-rev div{background:var(--na-l0); border:1px solid var(--na-line); border-radius:7px; padding:8px 10px;}
.na-rev .k{color:var(--na-muted); font-size:10px;}
.na-rev .v{font-weight:650; margin-top:1px;}
.na-adv{font-size:12.5px; color:var(--na-fg); opacity:.9; padding-left:18px; margin:0;}
.na-adv li{margin-bottom:6px;}
.na-adv li:last-child{margin-bottom:0;}
.na-foot{font-size:11px; color:var(--na-muted); padding:11px 20px; border-top:1px solid var(--na-line);
  background:var(--na-l1); line-height:1.6;}
</style>

<div class="na-top">
  <h2 class="na-title">Negotiation Arena · 跨境采购谈判对抗模拟</h2>
  <p class="na-sub" id="na-scen"></p>
  <div class="na-badges">
    <span class="na-badge on">隐藏信息</span>
    <span class="na-badge on">状态演化</span>
    <span class="na-badge on">策略适应</span>
    <span class="na-badge on">时间回溯</span>
    <span class="na-badge" id="na-seed"></span>
  </div>
</div>

<div class="na-strip">
  <div class="na-cell"><div class="k">回合</div><div class="v" id="na-round">1<small>/12</small></div></div>
  <div class="na-cell"><div class="k">信任</div><div class="v" id="na-trust">50</div><div class="na-bar"><i id="na-trust-b"></i></div></div>
  <div class="na-cell"><div class="k">张力</div><div class="v" id="na-tension">20</div><div class="na-bar"><i id="na-tension-b"></i></div></div>
  <div class="na-cell"><div class="k">年度毛利</div><div class="v" id="na-profit">—<small>万$</small></div></div>
  <div class="na-cell"><div class="k">毛利率</div><div class="v" id="na-margin">—<small>%</small></div></div>
</div>

<div class="na-phases" id="na-phases"></div>

<div class="na-body">
  <div class="na-pane"><div class="na-log" id="na-log" role="log" aria-live="polite" aria-label="谈判记录"></div></div>
  <div class="na-pane">
    <div class="na-ctl">
      <div>
        <div class="na-sec"><span>你的条款提案</span><span class="hint" id="na-vs"></span></div>
        <div class="na-grid" id="na-terms"></div>
        <label class="na-chk"><input type="checkbox" id="na-excl"><span>授予区域独家</span></label>
      </div>
      <div>
        <div class="na-sec"><span>内部核算</span></div>
        <div class="na-econ">
          <div><div class="k">单位成本</div><div class="v" id="na-uc">—</div></div>
          <div><div class="k">单位毛利</div><div class="v" id="na-um">—</div></div>
          <div><div class="k">信用敞口</div><div class="v" id="na-ex">—</div></div>
        </div>
        <div class="na-cfo-box" id="na-cfo"></div>
      </div>
      <div>
        <div class="na-sec"><span>沟通策略</span><span class="hint">决定对方如何解读这次让步</span></div>
        <div class="na-moves" id="na-moves"></div>
      </div>
      <div>
        <div class="na-sec"><span>你要说的话</span><span class="hint">可留空</span></div>
        <textarea class="na-ta" id="na-note" placeholder="例：我把成本拆开给你看——单价 23.5 对应 20 万台的排产摊销，如果量能到 22 万台，我可以在账期上再让 15 天。"></textarea>
      </div>
      <div class="na-act">
        <button type="button" class="na-btn primary" id="na-send">提交本轮报价</button>
        <button type="button" class="na-btn ghost" id="na-reset" title="换一个对手重新开局">新对局</button>
      </div>
      <div>
        <div class="na-sec"><span>时间回溯</span><span class="hint">回到任一节点重新决策</span></div>
        <div class="na-snaps" id="na-snaps"></div>
      </div>
    </div>
  </div>
</div>

<div class="na-rep" id="na-rep"></div>
<div class="na-foot">对手的预算、最低采购量、锁量窗口与备选方案全程隐藏，仅在复盘时揭示。人物设定基于可验证的组织处境（审批权限、考核口径、现金周期），不以国籍推断行为。</div>
<!-- NA_BUNDLE -->
<script>
/*!
 * Negotiation Arena — 跨文化商业谈判多 Agent 对抗引擎
 * 零依赖 UMD 模块：浏览器内联脚本与 Node (require) 共用同一份实现。
 *
 * 设计要点：

 *  2) 状态演化：每一次报价/让步/承诺都会改变 terms、meters(trust/tension) 与阶段 FSM。
 *  3) 策略适应：买方根据对手的让步模式、强硬度、信息质量动态调整让步率与接受阈值。
 *  4) 可复现：所有随机性来自状态内 rngSeed，快照回溯后重放结果确定可复现。
 *  5) 文化建模：以"组织流程 / 授权结构 / 书面化要求"等可验证情境变量刻画，不使用国籍刻板印象。
 */
(function (global, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) { module.exports = api; }
  global.NegotiationArena = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * 基础工具
   * ------------------------------------------------------------------ */

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  function hashSeed(str) {

        return '坦白讲，这个结构我拿不进审批会。我们先暂停，我去跟另一家把方案走完——如果你们的条件有实质变化，再联系我。';
      }

      // counter
      if (decision.reason === 'premature-ultimatum') {
        lines.push('你现在给我一个"不可再让"，但我手上连一份完整的条款清单都还没有。我们这边任何让步都要落到书面条目上，' +
          '口头的最后通牒进不了审批流，只会让我把这单重新排期。');
      } else if (decision.violations.indexOf('above-reserve') >= 0) {
        lines.push('单价 ' + r2(offer.price) + ' 超出我这个品类能承受的区间，不是谈判姿态，是真的过不了毛利测算。');
      } else if (decision.violations.indexOf('cash-cycle') >= 0) {
        lines.push('账期 ' + offer.netDays + ' 天我做不了——我的渠道回款周期本身就要两个月，这等于让我拿自有资金垫货。');
      } else if (decision.violations.indexOf('deposit-too-high') >= 0) {
        lines.push('预付 ' + offer.depositPct + '% 太高了，我的现金只能支持三成以内，再高就要走额外审批。');
      } else if (decision.violations.indexOf('volume-floor') >= 0) {
        lines.push('量太小了，这个数撑不起我在区域里铺货，渠道会觉得我们没诚意。');
      } else if (decision.reason === 'below-batna') {
        lines.push('说实话，这版的整体价值还不如我手上另一个方案。我愿意继续谈，是因为你们的交付确定性更好，但差距得补回来。');
      } else if (ten > 65) {
        lines.push('我们都把话说得挺硬了。我只关心一件事：这份协议能不能过我的审批会。');
      } else if (t > 65) {
        lines.push('我明白你们产线扩产的压力，我也希望这单能一次谈成，省掉下一轮比价。');
      } else {
        lines.push('方向可以，但差距还在。');
      }

      lines.push('我这边的版本是：单价 ' + r2(c.price) + ' 美元、年度 ' + c.qty + ' 万台、预付 ' + c.depositPct +
        '%、账期 ' + c.netDays + ' 天、质保 ' + c.warrantyMonths + ' 个月' + (c.exclusivity ? '、区域独家。' : '、不要求独家。'));

      if (move === 'probe' && !mem.disclosed.escalation) {
        mem.disclosed.escalation = true;
        lines.push('另外提醒一句：我个人签批到 300 万美元，超过这个数要等董事会例会，一个月才一次。');
      } else if (move === 'tradeoff') {
        lines.push('如果你能把这条写成"量到 ' + Math.max(c.qty, 18) + ' 万台则单价下调"的阶梯条款，我可以在账期上往回让一点。');
      } else if (move === 'rapport' && !mem.disclosed.kpi && state.meters.trust > 58) {
        mem.disclosed.kpi = true;
        lines.push('我也跟你交个底：我今年的考核里加了交付确定性那一项，缺货比贵两毛钱更要命。');
      } else if (state.round >= priv.deadlineRound - 1 && !mem.disclosed.deadline) {
        mem.disclosed.deadline = true;
        lines.push('时间上我确实有压力，旺季备货的锁量窗口快关了。');
      }
      return lines.join(' ');
    }

    /* ---------------- 跨文化顾问：基于可验证情境，不做国籍归因 ---------------- */

    function advisorAnalyze(state, offer, move, decision) {
      var tips = [];
      var mem = state._private.buyerMemory;
      var priv = state._private.buyer;
      var norms = SCENARIO.counterpart.norms;
      var annual = offer.price * offer.qty;

      // 行为画像推断：只用"已经被观察到的行为"下判断，不直接读私有字段
      var read = profileRead(state);
      if (read) { tips.push(read); }

      if (norms.prefersWritten && (move === 'pressure' || move === 'ultimatum')) {
        tips.push({
          level: 'warn',
          text: '她的流程要求"让步必须落到书面条目"。纯口头施压在她那边无法转化为审批材料，' +
            '容易被当成拖延——把同样的强硬改写成一份带成本依据的条款清单，压力值更高、信任损耗更低。'
        });
      }
      if (move === 'ultimatum' && state.round < 5) {
        tips.push({ level: 'warn', text: '条款清单尚未成形就发最后通牒，这是本场最贵的一步：它同时削弱了可信度和回旋空间。' });
      }
      if (annual > norms.escalationCeiling) {
        tips.push({
          level: 'info',
          text: '当前年度合同额约 ' + r0(annual) + ' 万美元，已越过她 300 万美元的个人签批线。' +
            '越线意味着要等月度董事会——要么把首年额度压到线下，要么主动把节奏拉长并要求她给出例会时间表。'
        });
      }
      if (mem.disclosed.kpi) {
        tips.push({ level: 'good', text: '她已经透露 KPI 含"交付确定性"。用产能保障、备货仓或缺货赔偿条款去换价格，比单纯降价便宜得多。' });
      }
      if (mem.disclosed.escalation && annual <= norms.escalationCeiling) {
        tips.push({ level: 'good', text: '合同额在她的签批权限内，可以要求"本周内签"，用确定性换一点价格。' });
      }
      if (state.meters.trust < 38) {
        tips.push({ level: 'warn', text: '信任已降到 ' + r0(state.meters.trust) + '。继续施压的边际收益在下降，她的让步步长会主动收缩。' });
      }
      if (decision && decision.reason === 'below-batna') {
        tips.push({ level: 'info', text: '她暗示手上有替代方案。先问"另一家的交付周期和质保怎么写"，比直接降价更能判断那是真备选还是议价工具。' });
      }
      if (!mem.probedCount && state.round >= 3) {
        tips.push({ level: 'info', text: '你还没有做过一次纯探询。隐藏信息是本场的主要变量，用一轮提问换底牌通常比一轮降价划算。' });
      }
      if (tips.length === 0) {
        tips.push({ level: 'good', text: '节奏健康：条款在收敛，信任没有被消耗。保持"每让一步都要换一条对等条款"的节奏。' });
      }
      return tips.slice(0, 3);
    }

    /* ---------------- 裁判：结构化评分 + 转折点识别 ---------------- */

    function judgeReport(state) {
      var final = state.status === 'deal' ? state.agreedTerms : state.terms;
      var review = cfoReview(final);
      var priv = state._private.buyer;
      var profit = yourProfit(final);
      var dealt = state.status === 'deal';

      var profitScore = dealt ? clamp(profit / ECON.profitBenchmark, 0, 1) * 100 : 0;
      var riskScore = dealt
        ? clamp(100 - Math.max(0, creditExposure(final) - ECON.creditCeiling * 0.6) / 2 -
            (final.netDays > 60 && final.depositPct < 15 ? 25 : 0) -
            (marginRatio(final) < 0.16 ? 15 : 0), 0, 100)
        : 40;
      var relationScore = clamp(state.meters.trust * 0.8 + (100 - state.meters.tension) * 0.2, 0, 100);
      var qualityScore = dealt
        ? clamp(40 + state.history.filter(function (h) { return h.move === 'tradeoff' || h.move === 'structured'; }).length * 9 +
            (final.exclusivity ? 6 : 0) + (state.infoGained * 7), 0, 100)
        : 20;
      var efficiency = dealt ? clamp(100 - (state.round - 1) * 5, 20, 100) : 0;

      var total = dealt
        ? r0(profitScore * 0.34 + riskScore * 0.2 + relationScore * 0.16 + qualityScore * 0.2 + efficiency * 0.10)
        : r0(relationScore * 0.3 + qualityScore * 0.2);

      // 转折点：对买方效用或信任产生最大单轮变化的回合
      var turning = [];
      state.history.forEach(function (h, i) {
        var mag = Math.abs(h.deltaBuyerUtility || 0) * 1.0 + Math.abs(h.deltaTrust || 0) * 0.9;
        turning.push({ idx: i, round: h.round, mag: mag, h: h });
      });
      turning.sort(function (a, b) { return b.mag - a.mag; });
      turning = turning.slice(0, 3).sort(function (a, b) { return a.round - b.round; }).map(function (x) {
        var h = x.h;
        var good = (h.deltaTrust || 0) >= 0 && (h.deltaBuyerUtility || 0) <= 0;
        return {
          round: h.round,
          move: MOVES[h.move] ? MOVES[h.move].label : h.move,
          summary: '第 ' + h.round + ' 轮 · ' + (MOVES[h.move] ? MOVES[h.move].label : h.move) +
            '：单价 ' + r2(h.offer.price) + ' / 量 ' + h.offer.qty + ' 万台 / 账期 ' + h.offer.netDays + ' 天',
          effect: '信任 ' + (h.deltaTrust >= 0 ? '+' : '') + r1(h.deltaTrust) +
            '，对方效用变化 ' + (h.deltaBuyerUtility >= 0 ? '+' : '') + r1(h.deltaBuyerUtility) + ' 万美元',
          verdict: good
            ? '有效步：在不加码的前提下推进了对方的接受概率。'
            : '代价步：你付出的让步大于换回的进展，或信任被消耗。',
          counterfactual: counterfactual(state, h)
        };
      });

      var reveal = {
        profileId: priv.profileId,
        profileLabel: priv.profileLabel,
        situation: priv.situation,
        reservePrice: priv.reservePrice,
        targetPrice: priv.targetPrice,
        minVolume: priv.minVolume,
        channelCap: priv.channelCap,
        cashCycleNeed: priv.cashCycleNeed,
        deadlineRound: priv.deadlineRound,
        batnaUtility: priv.batnaUtility,
        batnaPrice: priv.batna.price
      };

      var gap = dealt ? r2(priv.reservePrice - final.price) : null;

      return {
        dealt: dealt,
        status: state.status,
        rounds: state.round - 1,
        terms: final,
        profit: r1(profit),
        marginRatio: r1(marginRatio(final) * 100),
        exposure: r0(creditExposure(final)),
        buyerUtility: r1(buyerUtility(final, priv)),
        scores: {
          total: total,
          profit: r0(profitScore),
          risk: r0(riskScore),
          relation: r0(relationScore),
          quality: r0(qualityScore),
          efficiency: r0(efficiency)
        },
        cfo: review,
        turning: turning,
        reveal: reveal,
        leftOnTable: gap,
        verdict: judgeVerdict(total, dealt, gap, state),
        advice: judgeAdvice(state, final, priv, dealt)
      };
    }

    function counterfactual(state, h) {
      var m = h.move;
      if (m === 'ultimatum' && h.round < 5) {
        return '若把这一步换成"结构化条款说明"，同样表达不可让，但她的让步步长不会被压缩到 35%。';
      }
      if (m === 'pressure' && h.deltaTrust < -5) {
        return '若改为条件交换（if-then），同样的价格立场能保住约 7 点信任，终局接受阈值会更低。';
      }
      if (m === 'probe') {
        return '这一步用一轮时间换了信息；若此时她已临近锁量窗口，直接出收敛报价的期望收益更高。';
      }
      if (h.deltaBuyerUtility > 4) {
        return '这是一次大让步。若拆成两次并各绑定一条对等条款，同样的终局价格可多留约 ' + r1(h.deltaBuyerUtility * 0.3) + ' 万美元毛利。';
      }
      return '若保留该立场一轮不动，她在时间压力下的期望衰减会替你完成一部分收敛。';
    }

    function judgeVerdict(total, dealt, gap, state) {
      if (!dealt && state.status === 'walkout') {
        return '谈崩。对方离场时张力 ' + r0(state.meters.tension) + '：强硬本身不是问题，问题是强硬没有被转成她能拿进审批会的材料。';
      }
      if (!dealt) { return '未成交。回合用尽，双方立场仍未收敛。'; }
      if (total >= 80) { return '优秀。利润、风险和关系同时守住，且条款结构具备可执行性。'; }
      if (total >= 62) { return '良好。成交质量扎实，但仍有可识别的让步浪费。'; }
      if (total >= 45) { return '及格。拿到了协议，代价是把一部分利润或风险余量让了出去。'; }
      return '勉强成交。这份协议在财务口径下接近边界，复盘重点是让步节奏。';
    }

    function judgeAdvice(state, final, priv, dealt) {
      var a = [];
      if (dealt && final.price < priv.reservePrice - 1.5) {
        a.push('她的真实保留价是 ' + priv.reservePrice + '，你成交在 ' + r2(final.price) +
          '，单价上多让了约 ' + r2(priv.reservePrice - final.price) + ' 美元 ≈ ' + r1((priv.reservePrice - final.price) * final.qty) + ' 万美元年毛利。');
      }
      if (state.infoGained === 0) {
        a.push('全程没有换到任何隐藏信息。至少用一轮纯探询去问审批权限和锁量窗口，这两项决定了你该在第几轮收口。');
      }
      if (state.history.filter(function (h) { return h.move === 'tradeoff'; }).length === 0) {
        a.push('没有使用过条件交换。单边让步会把你的让步速率暴露给对方的适应模型，让她更有耐心。');
      }
      if (final.netDays > 60 && final.depositPct < 20) {
        a.push('账期与预付的组合把信用敞口推到 ' + r0(creditExposure(final)) + ' 万美元，下次用"账期换预付"而不是"账期换价格"。');
      }
      if (state.round > priv.deadlineRound) {
        a.push('她的锁量窗口在第 ' + priv.deadlineRound + ' 轮，你拖过了那个点——越过窗口后她的时间压力反而释放了。');
      }
      if (a.length === 0) { a.push('让步节奏、信息获取与风险控制都在合理区间，可直接复用这套打法。'); }
      return a;
    }

    // 从可观察行为推断对手画像；证据不足时明确说"还看不出来"
    function profileRead(state) {
      var h = state.history;
      if (h.length < 2) { return null; }
      var priv = state._private.buyer;
      // 对手让步幅度（她的还价在价格维度上的移动）
      var moves = [];
      for (var i = 1; i < h.length; i++) {
        moves.push(Math.abs(h[i].buyerUtility - h[i - 1].buyerUtility));
      }
      var avg = moves.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, moves.length);
      var pressured = h.filter(function (x) { return x.move === 'pressure' || x.move === 'ultimatum'; }).length;

      var guess, confidence;
      if (avg > 9) { guess = '交付优先型'; confidence = h.length >= 4 ? '较高' : '初步'; }
      else if (avg < 3.5 && pressured >= 1) { guess = '压价导向型'; confidence = h.length >= 4 ? '较高' : '初步'; }
      else if (mem_disclosed(state, 'escalation')) { guess = '流程导向型'; confidence = '初步'; }
      else { guess = null; }

      if (!guess) {
        return { level: 'info', text: '行为样本还不足以判断她的谈判画像：她的让步幅度和你的动作之间尚未出现稳定相关。再观察一到两轮，或用一次探询加快取样。' };
      }
      var hit = guess === priv.profileLabel;
      return {
        level: 'info',
        text: '行为画像（' + confidence + '置信）：她每轮让步折算约 ' + r1(avg) + ' 万美元价值，' +
          (pressured ? '且在你施压后' + (avg < 3.5 ? '明显收缩' : '仍保持节奏') + '，' : '') +
          '更接近「' + guess + '」。注意这是从她的行为推断的，不是从她来自哪个国家推断的——' +
          '若后续观察与此矛盾，以行为为准。'
      };
    }
    function mem_disclosed(state, key) { return !!state._private.buyerMemory.disclosed[key]; }

    api.buyerDecide = buyerDecide;    api.buyerSpeak = buyerSpeak;
    api.advisorAnalyze = advisorAnalyze;
    api.judgeReport = judgeReport;
  }

  /* ================================================================== *
   * 引擎层：有限状态机 + 状态持久化 + 时间回溯
   * ================================================================== */

  function installEngine(api) {

    var PHASES = [
      { id: 'opening',    label: '开场定调',   desc: '建立议程与可信度，尚未进入实质还价' },
      { id: 'exploring',  label: '探询试探',   desc: '双方交换信息，条款区间开始显形' },
      { id: 'bargaining', label: '实质议价',   desc: '条款在收敛，每一步让步都有价格' },
      { id: 'endgame',    label: '终局收口',   desc: '时间压力主导，接受阈值快速下移' },
      { id: 'closed',     label: '已结束',     desc: '协议达成或谈判终止' }
    ];
    api.PHASES = PHASES;

    var DEFAULT_OPENING = {
      price: 26.5, qty: 15, depositPct: 20, netDays: 30, warrantyMonths: 12, exclusivity: false
    };
    var BUYER_OPENING = {
      price: 19.5, qty: 22, depositPct: 0, netDays: 75, warrantyMonths: 24, exclusivity: true
    };

    function createGame(opts) {
      opts = opts || {};
      var seedStr = String(opts.seed || ('arena-' + Date.now()));
      var seedNum = hashSeed(seedStr);
      var rng = mulberry32(seedNum);
      var priv = makeBuyerPrivate(rng);

      var state = {
        scenarioId: SCENARIO.id,
        seed: seedStr,
        round: 1,
        maxRounds: SCENARIO.maxRounds,
        phase: 'opening',
        status: 'active',          // active | deal | walkout | timeout
        terms: clone(DEFAULT_OPENING),
        buyerPosition: clone(BUYER_OPENING),
        agreedTerms: null,
        meters: { trust: 50, tension: 20 },
        infoGained: 0,
        history: [],
        transcript: [],
        snapshots: [],
        _rngCursor: 0,
        _private: {
          buyer: priv,
          buyerStance: clone(BUYER_OPENING),
          buyerMemory: {
            adaptation: 0,
            avgConcession: 0,
            concessions: [],
            trustBias: 0,
            probedCount: 0,
            disclosed: { escalation: false, kpi: false, deadline: false },
            lastBuyerUtility: null
          }
        }
      };
      attachRng(state);

      state.transcript.push({
        round: 0, speaker: 'system', name: '场景',
        text: SCENARIO.title + '。' + SCENARIO.you.brief +
          ' 对手是 ' + SCENARIO.counterpart.name + '（' + SCENARIO.counterpart.org + '，' +
          SCENARIO.counterpart.role + '）。她的预算、最低采购量和内部截止期对你不可见。'
      });
      state.transcript.push({
        round: 0, speaker: 'buyer', name: SCENARIO.counterpart.name,
        text: '感谢你们飞过来。先把话放在桌面上：我今年要在区域里重新定这个品类的盘子。' +
          '我的开口版本是单价 19.5 美元、年度 22 万台、账期 75 天、质保 24 个月、区域独家。' +
          '另外说明一下我们的流程——任何让步最后都要落到书面条款清单上，我才能拿进审批。'
      });
      takeSnapshot(state, '开局');
      return state;
    }

    // rng 需要在序列化后仍可复现：用 seed + 游标重建
    function attachRng(state) {
      var base = hashSeed(state.seed);
      var cursor = state._rngCursor || 0;
      var gen = mulberry32(base + cursor * 7919);
      state._rng = function () {
        state._rngCursor = (state._rngCursor || 0) + 1;
        return gen();
      };
    }

    function publicState(state) {
      var s = {};
      Object.keys(state).forEach(function (k) {
        if (k.charAt(0) === '_') { return; }
        if (k === 'snapshots') {
          // 快照内含对手私有信息，对外只暴露可选节点的元数据
          s.snapshots = state.snapshots.map(function (sn) {
            return {
              id: sn.id, label: sn.label, round: sn.round,
              phase: sn.phase, status: sn.status,
              trust: sn.trust, tension: sn.tension, profit: sn.profit
            };
          });
          return;
        }
        s[k] = state[k];
      });
      s.phaseInfo = PHASES.filter(function (p) { return p.id === state.phase; })[0];
      s.economics = {
        unitCost: r2(unitCost(state.terms.qty)),
        unitMargin: r2(yourUnitMargin(state.terms)),
        profit: r1(yourProfit(state.terms)),
        marginRatio: r1(marginRatio(state.terms) * 100),
        exposure: r0(creditExposure(state.terms))
      };
      return clone(s);
    }

    function phaseFor(state) {
      if (state.status !== 'active') { return 'closed'; }
      var r = state.round, max = state.maxRounds;
      if (r <= 2) { return 'opening'; }
      if (r <= Math.ceil(max * 0.45)) { return 'exploring'; }
      if (r <= max - 3) { return 'bargaining'; }
      return 'endgame';
    }

    function normalizeTerms(t) {
      var o = {};
      TERMS_META.forEach(function (m) {
        if (m.type === 'bool') { o[m.key] = !!t[m.key]; return; }
        var v = Number(t[m.key]);
        if (!isFinite(v)) { v = m.min; }
        o[m.key] = clamp(v, m.min, m.max);
      });
      o.price = r2(o.price);
      o.qty = r0(o.qty);
      o.depositPct = r0(o.depositPct / 5) * 5;
      o.netDays = r0(o.netDays / 15) * 15;
      o.warrantyMonths = [12, 18, 24].reduce(function (best, c) {
        return Math.abs(c - o.warrantyMonths) < Math.abs(best - o.warrantyMonths) ? c : best;
      }, 12);
      return o;
    }

    /* ---------------- 核心：提交一轮报价 ---------------- */

    function submitOffer(state, input) {
      if (state.status !== 'active') {
        return { ok: false, error: '谈判已结束（' + state.status + '），可回溯到任一节点重新决策。' };
      }
      var offer = normalizeTerms(input.terms);
      var move = MOVES_HAS(input.move) ? input.move : 'structured';
      var note = (input.note || '').trim();

      // --- 内部关卡：财务负责人拥有硬否决权 ---
      var review = cfoReview(offer);
      if (!review.approved) {
        return {
          ok: false,
          blockedBy: 'cfo',
          review: review,
          message: review.vetoes.map(function (v) { return v.text; }).join(' ')
        };
      }

      var priv = state._private.buyer;
      var mem = state._private.buyerMemory;
      var before = {
        trust: state.meters.trust,
        buyerUtility: buyerUtility(offer, priv),
        prevBuyerUtility: mem.lastBuyerUtility
      };

      // --- 策略适应信号：对手这一轮让了多少（买方效用口径） ---
      if (mem.lastBuyerUtility !== null) {
        var delta = before.buyerUtility - mem.lastBuyerUtility;
        mem.concessions.push(delta);
        var sum = mem.concessions.reduce(function (a, b) { return a + b; }, 0);
        mem.avgConcession = sum / mem.concessions.length;
        mem.adaptation = clamp(-mem.avgConcession / 6, -1, 1); // 让得多 → adaptation 偏负（软）
      }

      // --- 沟通动作对仪表的影响（受情境约束调节） ---
      var m = api.MOVES[move];
      var trustDelta = m.trust, tensionDelta = m.tension;
      if (SCENARIO.counterpart.norms.prefersWritten) {
        if (move === 'structured') { trustDelta += 3; }
        if (move === 'pressure' || move === 'ultimatum') { trustDelta -= 3; }
      }
      if (move === 'ultimatum' && state.round < 5) { trustDelta -= 6; tensionDelta += 6; }
      if (note.length > 24) { trustDelta += 1; } // 有实质论述的发言略有加成
      state.meters.trust = clamp(state.meters.trust + trustDelta, 0, 100);
      state.meters.tension = clamp(state.meters.tension + tensionDelta, 0, 100);
      mem.trustBias = (state.meters.trust - 50) / 50;
      if (move === 'probe') { mem.probedCount++; }

      var disclosedBefore = countDisclosed(mem);

      // --- 买方决策 ---
      var decision = api.buyerDecide(state, offer, move);
      var speech = api.buyerSpeak(state, offer, decision, move);
      var disclosedAfter = countDisclosed(mem);
      if (disclosedAfter > disclosedBefore) { state.infoGained += disclosedAfter - disclosedBefore; }

      // --- 状态演化 ---
      state.terms = offer;
      mem.lastBuyerUtility = before.buyerUtility;

      var record = {
        round: state.round,
        move: move,
        moveLabel: m.label,
        note: note,
        offer: clone(offer),
        buyerAction: decision.action,
        buyerReason: decision.reason,
        buyerUtility: r2(decision.utility),
        buyerThreshold: r2(decision.threshold),
        deltaTrust: r1(state.meters.trust - before.trust),
        deltaBuyerUtility: before.prevBuyerUtility === null ? 0 : r2(before.buyerUtility - before.prevBuyerUtility),
        trust: r0(state.meters.trust),
        tension: r0(state.meters.tension),
        phase: state.phase
      };

      state.transcript.push({
        round: state.round, speaker: 'you', name: '你（' + SCENARIO.you.org + '）',
        move: m.label,
        text: (note || '（按条款清单提交该版本）'),
        terms: clone(offer)
      });

      if (review.flags.length) {
        state.transcript.push({
          round: state.round, speaker: 'cfo', name: SCENARIO.cfo.name + '（内部）',
          text: review.flags.map(function (f) { return f.text; }).join(' ')
        });
      }

      state.transcript.push({
        round: state.round, speaker: 'buyer', name: SCENARIO.counterpart.name,
        text: speech,
        terms: decision.counter ? clone(decision.counter) : null
      });

      if (decision.action === 'accept') {
        state.status = 'deal';
        state.agreedTerms = clone(offer);
      } else if (decision.action === 'walkout') {
        state.status = 'walkout';
      } else {
        state.buyerPosition = clone(decision.counter);
        state.round++;
        if (state.round > state.maxRounds) {
          state.status = 'timeout';
          state.transcript.push({
            round: state.maxRounds, speaker: 'system', name: '系统',
            text: '回合用尽，框架协议未在窗口期内达成。'
          });
        }
      }

      state.phase = phaseFor(state);
      state.history.push(record);

      var advisor = api.advisorAnalyze(state, offer, move, decision);
      state.transcript.push({
        round: record.round, speaker: 'advisor', name: SCENARIO.advisor.name,
        text: advisor.map(function (t) { return t.text; }).join(' ')
      });

      takeSnapshot(state, '第 ' + record.round + ' 轮 · ' + m.label);

      return {
        ok: true,
        record: record,
        review: review,
        advisor: advisor,
        decision: { action: decision.action, reason: decision.reason },
        counter: decision.counter,
        speech: speech,
        state: publicState(state),
        report: state.status !== 'active' ? api.judgeReport(state) : null
      };
    }

    function MOVES_HAS(k) { return !!(k && api.MOVES[k]); }
    function countDisclosed(mem) {
      var d = mem.disclosed, n = 0;
      Object.keys(d).forEach(function (k) { if (d[k]) { n++; } });
      return n;
    }

    /* ---------------- 时间回溯：快照 / 还原 / 分支 ---------------- */

    function takeSnapshot(state, label) {
      var snap = {
        id: 'sn-' + state.snapshots.length,
        label: label,
        round: state.round,
        phase: state.phase,
        status: state.status,
        trust: r0(state.meters.trust),
        tension: r0(state.meters.tension),
        profit: r1(yourProfit(state.terms)),
        data: null
      };
      var copy = {};
      Object.keys(state).forEach(function (k) {
        if (k === 'snapshots' || k === '_rng') { return; }
        copy[k] = clone(state[k]);
      });
      snap.data = copy;
      state.snapshots.push(snap);
      return snap;
    }

    // 回溯到某个快照，并把其后的分支保留为"平行线"记录
    function rewind(state, snapshotId) {
      var idx = -1;
      for (var i = 0; i < state.snapshots.length; i++) {
        if (state.snapshots[i].id === snapshotId) { idx = i; break; }
      }
      if (idx < 0) { return { ok: false, error: '未找到该节点。' }; }

      var abandoned = state.snapshots.slice(idx + 1).map(function (s) {
        return { label: s.label, round: s.round, profit: s.profit, trust: s.trust, status: s.status };
      });
      var branch = {
        fromSnapshot: snapshotId,
        fromRound: state.snapshots[idx].round,
        abandoned: abandoned,
        outcome: state.status,
        profitAtAbandon: r1(yourProfit(state.status === 'deal' ? state.agreedTerms : state.terms))
      };
      var branches = (state.branches || []).concat(abandoned.length ? [branch] : []);

      var data = clone(state.snapshots[idx].data);
      Object.keys(state).forEach(function (k) {
        if (k === 'snapshots' || k === '_rng') { return; }
        delete state[k];
      });
      Object.keys(data).forEach(function (k) { state[k] = data[k]; });
      state.snapshots = state.snapshots.slice(0, idx + 1);
      state.branches = branches;
      attachRng(state);

      state.transcript.push({
        round: state.round, speaker: 'system', name: '时间回溯',
        text: '已回到「' + state.snapshots[idx].label + '」。对方的隐藏信息与记忆同步回滚，' +
          '你可以在这个节点做出不同决策，观察情景如何分叉。'
      });
      return { ok: true, state: publicState(state), branches: branches };
    }

    /* ---------------- 持久化：导出 / 载入（长期状态存储） ---------------- */

    function save(state) {
      var copy = {};
      Object.keys(state).forEach(function (k) {
        if (k === '_rng') { return; }
        copy[k] = state[k];
      });
      return JSON.stringify({ v: 1, savedAt: new Date().toISOString(), state: copy });
    }

    function load(json) {
      var parsed = typeof json === 'string' ? JSON.parse(json) : json;
      var state = parsed.state || parsed;
      attachRng(state);
      return state;
    }

    /* ---------------- 便捷：当前可见信息（给 UI / Agent 用） ---------------- */

    function inspect(state) {
      return {
        round: state.round,
        maxRounds: state.maxRounds,
        phase: state.phase,
        status: state.status,
        yourTerms: clone(state.terms),
        buyerPosition: clone(state.buyerPosition),
        meters: clone(state.meters),
        economics: publicState(state).economics,
        knownAboutBuyer: Object.keys(state._private.buyerMemory.disclosed)
          .filter(function (k) { return state._private.buyerMemory.disclosed[k]; })
      };
    }

    api.createGame = createGame;
    api.publicState = publicState;
    api.submitOffer = submitOffer;
    api.rewind = rewind;
    api.save = save;
    api.load = load;
    api.inspect = inspect;
    api.normalizeTerms = normalizeTerms;
    api.takeSnapshot = takeSnapshot;
    api.DEFAULT_OPENING = DEFAULT_OPENING;
    api._internal = { unitCost: unitCost, makeBuyerPrivate: makeBuyerPrivate, mulberry32: mulberry32 };
  }
});

<script>
/* Negotiation Arena · UI 控制器（在 fragment 内运行，依赖已内联的 NegotiationArena） */
(function () {
  'use strict';
  var A = window.NegotiationArena;
  var root = document.getElementById('na-root');
  if (!root || !A) { return; }

  var $ = function (id) { return document.getElementById(id); };
  var game = null;
  var selectedMove = 'structured';
  var termInputs = {};

  var SPEAKER = { you: '我', buyer: 'D', cfo: '财', advisor: '顾', system: '系', judge: '裁' };

  function fmt(n, d) { var p = Math.pow(10, d || 0); return (Math.round(n * p) / p).toFixed(d || 0); }

  /* ---------------- 初始化 ---------------- */
  function boot(seed) {
    game = A.createGame({ seed: seed || ('arena-' + Math.floor(Math.random() * 1e9)) });
    $('na-scen').textContent = A.SCENARIO.you.brief + ' 你的对手是 ' + A.SCENARIO.counterpart.name +
      '（' + A.SCENARIO.counterpart.org + ' · ' + A.SCENARIO.counterpart.role + '）。';
    $('na-seed').textContent = '对局 ' + game.seed.slice(-6);
    buildTerms();
    buildMoves();
    buildPhases();
    renderLog(true);
    refresh();
    $('na-rep').className = 'na-rep';
    $('na-note').value = '';
  }

  /* ---------------- 条款滑块 ---------------- */
  function buildTerms() {
    var host = $('na-terms');
    host.innerHTML = '';
    termInputs = {};
    A.TERMS_META.forEach(function (m) {
      if (m.type === 'bool') { return; }
      var wrap = document.createElement('div');
      wrap.className = 'na-f';
      var id = 'na-t-' + m.key;
      var lab = document.createElement('label');
      lab.setAttribute('for', id);
      lab.innerHTML = m.label + ' <b id="' + id + '-v"></b>';
      var inp = document.createElement('input');
      inp.type = 'range'; inp.id = id;
      inp.min = m.min; inp.max = m.max; inp.step = m.step;
      inp.value = A.DEFAULT_OPENING[m.key];
      inp.addEventListener('input', function () { syncTermLabel(m); refresh(); });
      wrap.appendChild(lab); wrap.appendChild(inp);
      host.appendChild(wrap);
      termInputs[m.key] = inp;
      syncTermLabel(m);
    });
    var ex = $('na-excl');
    ex.checked = !!A.DEFAULT_OPENING.exclusivity;
    ex.onchange = refresh;
  }

  function syncTermLabel(m) {
    var el = $('na-t-' + m.key + '-v');
    if (el) {
      var v = Number(termInputs[m.key].value);
      el.textContent = (m.step < 1 ? v.toFixed(1) : String(v)) + (m.unit ? ' ' + m.unit : '');
    }
  }

  function currentTerms() {
    var t = {};
    A.TERMS_META.forEach(function (m) {
      t[m.key] = m.type === 'bool' ? $('na-excl').checked : Number(termInputs[m.key].value);
    });
    return A.normalizeTerms(t);
  }

  /* ---------------- 策略按钮 ---------------- */
  function buildMoves() {
    var host = $('na-moves');
    host.innerHTML = '';
    Object.keys(A.MOVES).forEach(function (key) {
      var m = A.MOVES[key];
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'na-mv';
      b.setAttribute('aria-pressed', key === selectedMove ? 'true' : 'false');
      b.dataset.move = key;
      b.innerHTML = '<span class="t"></span><span class="h"></span>';
      b.querySelector('.t').textContent = m.label;
      b.querySelector('.h').textContent = m.hint;
      b.addEventListener('click', function () {
        selectedMove = key;
        Array.prototype.forEach.call(host.querySelectorAll('.na-mv'), function (x) {
          x.setAttribute('aria-pressed', x.dataset.move === key ? 'true' : 'false');
        });
      });
      host.appendChild(b);
    });
  }

  /* ---------------- 阶段条 ---------------- */
  function buildPhases() {
    var host = $('na-phases');
    host.innerHTML = '';
    A.PHASES.forEach(function (p) {
      var d = document.createElement('div');
      d.className = 'na-ph'; d.dataset.phase = p.id;
      d.innerHTML = '<div class="dot"></div><div class="lb"></div>';
      d.querySelector('.lb').textContent = p.label;
      d.title = p.desc;
      host.appendChild(d);
    });
  }

  function paintPhases() {
    var order = A.PHASES.map(function (p) { return p.id; });
    var cur = order.indexOf(game.phase);
    Array.prototype.forEach.call($('na-phases').children, function (el, i) {
      el.className = 'na-ph' + (i < cur ? ' done' : (i === cur ? ' cur' : ''));
    });
  }

  /* ---------------- 刷新仪表 / 核算 ---------------- */
  function refresh() {
    var s = A.publicState(game);
    var t = currentTerms();

    $('na-round').innerHTML = Math.min(game.round, game.maxRounds) + '<small>/' + game.maxRounds + '</small>';
    var tr = s.meters.trust, te = s.meters.tension;
    $('na-trust').textContent = fmt(tr, 0);
    $('na-tension').textContent = fmt(te, 0);
    var tb = $('na-trust-b'), eb = $('na-tension-b');
    tb.style.width = tr + '%';
    tb.style.background = tr > 62 ? 'var(--na-good)' : (tr > 38 ? 'var(--na-warn)' : 'var(--na-bad)');
    eb.style.width = te + '%';
    eb.style.background = te > 65 ? 'var(--na-bad)' : (te > 40 ? 'var(--na-warn)' : 'var(--na-good)');

    var profit = A.yourProfit(t), ratio = A.marginRatio(t) * 100;
    $('na-profit').innerHTML = fmt(profit, 1) + '<small>万$</small>';
    $('na-margin').innerHTML = fmt(ratio, 1) + '<small>%</small>';
    $('na-margin').style.color = ratio < 12 ? 'var(--na-bad)' : (ratio < 16 ? 'var(--na-warn)' : 'var(--na-fg)');
    $('na-uc').textContent = '$' + fmt(A.unitCost(t.qty), 2);
    $('na-um').textContent = '$' + fmt(A.yourUnitMargin(t), 2);
    $('na-ex').textContent = fmt(A.creditExposure(t), 0) + '万';

    var bp = s.buyerPosition;
    $('na-vs').textContent = '对方当前立场 $' + fmt(bp.price, 2) + ' / ' + bp.qty + '万台 / ' + bp.netDays + '天';

    // CFO 实时审核
    var rev = A.cfoReview(t);
    var box = $('na-cfo');
    if (!rev.approved) {
      box.className = 'na-cfo-box veto';
      box.innerHTML = '<b>' + A.SCENARIO.cfo.name + ' 不批准：</b>' + rev.vetoes.map(function (v) { return v.text; }).join(' ');
    } else if (rev.flags.length) {
      box.className = 'na-cfo-box';
      box.innerHTML = '<b>' + A.SCENARIO.cfo.name + '：</b>' + rev.flags.map(function (f) { return f.text; }).join(' ');
    } else {
      box.className = 'na-cfo-box';
      box.innerHTML = '<b>' + A.SCENARIO.cfo.name + '：</b>该版本在毛利与信用口径内，可以提。';
    }

    var over = game.status !== 'active';
    $('na-send').disabled = over || !rev.approved;
    $('na-send').textContent = over ? '谈判已结束' : (rev.approved ? '提交本轮报价' : '财务未批准');

    paintPhases();
    renderSnaps();
  }

  /* ---------------- 对话渲染 ---------------- */
  var renderedCount = 0;
  function renderLog(full) {
    var log = $('na-log');
    if (full) { log.innerHTML = ''; renderedCount = 0; }
    if (game.transcript.length < renderedCount) { log.innerHTML = ''; renderedCount = 0; }
    for (var i = renderedCount; i < game.transcript.length; i++) {
      log.appendChild(msgNode(game.transcript[i]));
    }
    renderedCount = game.transcript.length;
    log.scrollTop = log.scrollHeight;
  }

  function msgNode(m) {
    var d = document.createElement('div');
    d.className = 'na-msg ' + m.speaker;
    var av = document.createElement('div');
    av.className = 'na-av'; av.textContent = SPEAKER[m.speaker] || '·';
    var bd = document.createElement('div');
    bd.className = 'bd';
    var nm = document.createElement('div');
    nm.className = 'na-nm';
    nm.textContent = m.name;
    if (m.move) {
      var tg = document.createElement('span');
      tg.className = 'tag'; tg.textContent = m.move;
      nm.appendChild(tg);
    }
    var tx = document.createElement('div');
    tx.className = 'na-tx'; tx.textContent = m.text;
    bd.appendChild(nm); bd.appendChild(tx);
    if (m.terms) {
      var tm = document.createElement('div');
      tm.className = 'na-terms';
      tm.textContent = '单价 $' + fmt(m.terms.price, 2) + ' · ' + m.terms.qty + ' 万台 · 预付 ' +
        m.terms.depositPct + '% · 账期 ' + m.terms.netDays + ' 天 · 质保 ' + m.terms.warrantyMonths +
        ' 月 · ' + (m.terms.exclusivity ? '区域独家' : '非独家');
      bd.appendChild(tm);
    }
    d.appendChild(av); d.appendChild(bd);
    return d;
  }

  /* ---------------- 快照 / 回溯 ---------------- */
  function renderSnaps() {
    var host = $('na-snaps');
    host.innerHTML = '';
    var snaps = A.publicState(game).snapshots;
    snaps.forEach(function (sn, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'na-sn';
      var isLast = i === snaps.length - 1;
      b.innerHTML = '<span class="l"></span><span class="m"></span>';
      b.children[0].textContent = sn.label;
      b.children[1].textContent = isLast ? '当前' : ('信任 ' + sn.trust + ' · ' + fmt(sn.profit, 0) + '万$');
      if (isLast) { b.disabled = true; b.style.opacity = '.5'; }
      else {
        b.addEventListener('click', function () {
          var r = A.rewind(game, sn.id);
          if (r.ok) {
            selectedMove = 'structured';
            buildMoves();
            syncSlidersFromState();
            renderLog(true);
            $('na-rep').className = 'na-rep';
            refresh();
          }
        });
      }
      host.appendChild(b);
    });
  }

  function syncSlidersFromState() {
    A.TERMS_META.forEach(function (m) {
      if (m.type === 'bool') { $('na-excl').checked = !!game.terms.exclusivity; return; }
      termInputs[m.key].value = game.terms[m.key];
      syncTermLabel(m);
    });
  }

  /* ---------------- 提交一轮 ---------------- */
  $('na-send').addEventListener('click', function () {
    if (game.status !== 'active') { return; }
    var res = A.submitOffer(game, {
      terms: currentTerms(),
      move: selectedMove,
      note: $('na-note').value
    });
    if (!res.ok) { refresh(); return; }
    $('na-note').value = '';
    renderLog(false);
    refresh();
    if (res.report) { renderReport(res.report); }
  });

  $('na-reset').addEventListener('click', function () { boot(); });

  /* ---------------- 复盘报告 ---------------- */
  function renderReport(rep) {
    var h = [];
    h.push('<h3>谈判复盘 · ' + (rep.dealt ? '协议达成' : (rep.status === 'walkout' ? '对方离场' : '回合用尽')) + '</h3>');
    h.push('<div class="na-verdict">' + esc(rep.verdict) + '</div>');

    var sc = rep.scores;
    h.push('<div class="na-scores">');
    h.push(card('总分', sc.total, true));
    h.push(card('利润', sc.profit));
    h.push(card('风险', sc.risk));
    h.push(card('关系', sc.relation));
    h.push(card('协议质量', sc.quality));
    h.push(card('效率', sc.efficiency));
    h.push('</div>');

    h.push('<div class="na-rsec"><h4>最终条款与结果</h4><div class="na-rev">');
    h.push(kv('成交单价', rep.dealt ? '$' + fmt(rep.terms.price, 2) : '未成交'));
    h.push(kv('年度毛利', fmt(rep.profit, 1) + ' 万$'));
    h.push(kv('毛利率', fmt(rep.marginRatio, 1) + '%'));
    h.push(kv('信用敞口', fmt(rep.exposure, 0) + ' 万$'));
    h.push('</div></div>');

    h.push('<div class="na-rsec"><h4>对手的隐藏信息（本局首次揭示）</h4><div class="na-rev">');
    h.push(kv('谈判画像', rep.reveal.profileLabel));
    h.push(kv('真实保留价', '$' + fmt(rep.reveal.reservePrice, 2)));
    h.push(kv('内部目标价', '$' + fmt(rep.reveal.targetPrice, 2)));
    h.push(kv('最低铺货量', rep.reveal.minVolume + ' 万台'));
    h.push(kv('渠道上限', rep.reveal.channelCap + ' 万台'));
    h.push(kv('账期硬需求', rep.reveal.cashCycleNeed + ' 天'));
    h.push(kv('锁量窗口', '第 ' + rep.reveal.deadlineRound + ' 轮'));
    h.push(kv('备选方案价值', fmt(rep.reveal.batnaUtility, 0) + ' 万$'));
    h.push('</div>');
    h.push('<div style="font-size:11.5px;color:var(--na-muted);margin-top:7px">她的处境：' +
      esc(rep.reveal.situation) + '</div>');
    if (rep.leftOnTable !== null && rep.leftOnTable > 0) {
      h.push('<div style="font-size:12px;color:var(--na-warn);margin-top:6px">单价上你距离她的保留价还有 $' +
        fmt(rep.leftOnTable, 2) + ' 的空间 ≈ ' + fmt(rep.leftOnTable * rep.terms.qty, 1) + ' 万美元年毛利。</div>');
    }
    h.push('</div>');

    h.push('<div class="na-rsec"><h4>关键转折点</h4>');
    rep.turning.forEach(function (t) {
      h.push('<div class="na-tp"><div class="s">' + esc(t.summary) + '</div>' +
        '<div class="e">' + esc(t.effect) + ' · ' + esc(t.verdict) + '</div>' +
        '<div class="cf">反事实：' + esc(t.counterfactual) + '</div></div>');
    });
    h.push('</div>');

    h.push('<div class="na-rsec"><h4>裁判建议</h4><ul class="na-adv">');
    rep.advice.forEach(function (a) { h.push('<li>' + esc(a) + '</li>'); });
    h.push('</ul></div>');
    h.push('<div style="font-size:11.5px;color:var(--na-muted)">想验证另一条路线？在右侧「时间回溯」里选一个节点，换一个沟通策略重新谈——对手的隐藏信息会同步回滚，结果可复现。</div>');

    var box = $('na-rep');
    box.innerHTML = h.join('');
    box.className = 'na-rep show';

    game.transcript.push({
      round: rep.rounds, speaker: 'judge', name: A.SCENARIO.judge.name,
      text: rep.verdict + ' 综合得分 ' + rep.scores.total + '/100。完整复盘见下方。'
    });
    renderLog(false);
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function card(k, v, total) {
    var color = v >= 75 ? 'var(--na-good)' : (v >= 50 ? 'var(--na-warn)' : 'var(--na-bad)');
    return '<div class="na-sc' + (total ? ' total' : '') + '"><div class="k">' + k +
      '</div><div class="v" style="color:' + color + '">' + v + '</div></div>';
  }  function kv(k, v) { return '<div><div class="k">' + k + '</div><div class="v">' + esc(String(v)) + '</div></div>'; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  boot();
})();

</script>
</div>
</div></body></html>
